<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="refresh" content="0; url=contenido/principal.html">
  <title>Redirigiendo... - Crispy Chips</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #C1272D 0%, #FF6B35 100%);
      color: white;
      text-align: center;
    }
    .loader {
      font-size: 3rem;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    h1 {
      margin-top: 1rem;
      font-size: 2rem;
    }
    p {
      margin-top: 0.5rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div>
    <div class="loader">🍟</div>
    <h1>Crispy Chips</h1>
    <p>Redirigiendo a la página principal...</p>
  </div>
  <script>
    // Redirección JavaScript como fallback
    setTimeout(() => {
      window.location.href = 'contenido/principal.html';
    }, 100);
  </script>
</body>
</html>
