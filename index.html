<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="container">
    <!-- Mitad izquierda: imagen -->
    <div class="left-side">
      <img src="imgs/fondo.jpg" alt="Fondo inicio de sesión" />
    </div>

    <!-- Mitad derecha: formulario -->
    <div class="right-side">
      <header class="color-bar" aria-hidden="true"></header>

      <div class="form-wrapper" role="main">
        <h1>Iniciar Sesión</h1>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn-primary">Iniciar Sesión</button>

          <div id="message" aria-live="polite" style="min-height:1.2rem;margin-top:10px;"></div>
        </form>

        <p>¿No tienes una cuenta? <a href="contenido/register.html">Crear Cuenta</a></p>
        <p><a href="contenido/principal.html">Entrar como invitado</a></p>
      </div>
    </div>
  </div>

  <!-- JS del frontend (asegúrate que existe en javascript/login.js) -->
  <script src="javascript/login.js"></script>
</body>
</html>
